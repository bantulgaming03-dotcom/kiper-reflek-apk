name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unduh three.js
        run: curl -fsSL -o app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Siapkan APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KiperReflek.apk
      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kiper Reflek 3D (build terbaru)
          files: KiperReflek.apk
          make_latest: true
